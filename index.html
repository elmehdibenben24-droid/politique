<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك الأسئلة الشامل - المدخل إلى العلوم السياسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 md:p-8 flex items-center justify-center">
    <div class="max-w-3xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 md:p-8 border border-slate-700">
        <header class="border-b border-slate-700 pb-4 mb-6 text-center">
            <h1 class="text-2xl font-bold text-teal-400">بنك الامتحانات الشامل - العلوم السياسية</h1>
            <p class="text-sm text-slate-400 mt-1">امتحانات السداسي الجامعي (أسئلة متعددة الاختيارات QCM)</p>
        </header>

        <div id="quiz-container">
            <div class="flex justify-between items-center mb-4">
                <span id="q-number" class="text-xs font-semibold bg-teal-900 text-teal-300 px-3 py-1 rounded-full">السؤال 1</span>
                <span id="progress-text" class="text-xs text-slate-400 font-medium"></span>
            </div>
            
            <div id="question-box" class="mb-6">
                <h2 id="q-text" class="text-lg font-medium text-white leading-relaxed"></h2>
            </div>

            <div id="options-box" class="space-y-3 mb-6"></div>

            <div class="flex justify-between items-center border-t border-slate-700 pt-4">
                <span id="score-display" class="font-semibold text-teal-400">النتيجة الصحيحة: 0</span>
                <button id="next-btn" onclick="nextQuestion()" class="bg-teal-600 hover:bg-teal-500 text-white font-medium px-6 py-2 rounded-xl transition hidden">السؤال الموالي</button>
            </div>
        </div>

        <div id="result-box" class="hidden text-center py-8">
            <h2 class="text-2xl font-bold text-white mb-2">انتهى الاختبار بنجاح!</h2>
            <p id="final-score" class="text-lg text-slate-300 mb-6"></p>
            <button onclick="restartQuiz()" class="bg-teal-600 hover:bg-teal-500 text-white font-medium px-6 py-2 rounded-xl">إعادة الاختبار</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "ما هو المعنى الاصطلاحي للظاهرة السياسية في الدراسات السياسية؟",
                o: ["كل ظاهرة تنجم عن تجمع إنساني وسلوك داخل مجتمع منظم لإقرار أهداف وتدبير الخلافات", "مجموعة القوانين الجنائية الوضعية الصرفة", "الأحكام الشرعية المتعلقة بالمعاملات فقط", "القرارات الإدارية البحتة الصادرة عن وزارة الداخلية"],
                c: 0
            },
            {
                q: "ما هي ركائز المدرسة الأمريكية في دراسة الظاهرة السياسية؟",
                o: ["تقول باستحالة وجود علم واحد مستقل للسياسة وتعتبرها مترابطة عضوياً مع العلوم الاجتماعية", "ترتكز بالكامل على القانون العام الوضعي الدستوري", "تعتمد حصراً على المنهج الوصفي التاريخي والفلسفي", "تمنع دراسة السلوك السياسي للجمهور"],
                c: 0
            },
            {
                q: "ماذا نتج عن اجتماع لجنة خبراء اليونسكو بباريس سنة 1950؟",
                o: ["إصدار الكتاب الجماعي 'علم السياسة المعاصر' وتحديد فروعه الأربعة الأساسية", "إلغاء تدريس علم السياسة في الجامعات", "فصل السياسة نهائياً عن العلاقات الدولية", "اعتماد الديمقراطية المباشرة وحدها"],
                c: 0
            },
            {
                q: "من هو الرائد التاريخي الذي دشن علم السياسة واعتمد منهج الملاحظة والاستقراء في كتابه 'السياسة'؟",
                o: ["أرسطو (المعلم الأول)", "نيكولا ميكيافيلي", "أوغست كونت", "كارل ماركس"],
                c: 0
            },
            {
                q: "ما الذي تميز به نيكولا ميكيافيلي في كتابه 'الأمير'؟",
                o: ["فصل الأخلاق عن السياسة واعتبر الدولة قوة واستمرارها رهين بالقوة والواقعية", "دافع عن الديمقراطية التشاركية المطلقة", "ربط السياسة بقواعد الفقه الإسلامي", "أكد على وجوب الخضوع للأخلاق والمثالية"],
                c: 0
            },
            {
                q: "ما هي الفروع الأربعة الأساسية لعلم السياسة حسب تصنيف اليونسكو سنة 1950؟",
                o: ["النظرية السياسية وتاريخ الأفكار، النظم السياسية، الأحزاب والرأي العام، والعلاقات الدولية", "القانون الجنائي، القانون المدني، المسطرة المدنية، والمسطرة الجنائية", "الاقتصاد الجزئي، المحاسبة العمومية، الإدارة المالية، والتجارة", "علم الاجتماع الأسري، الأنثروبولوجيا الثقافية، الجرائم التطبيقي، والتاريخ الحديث"],
                c: 0
            },
            {
                q: "ما هو مفهوم النسق السياسي عند دافيد إيستون؟",
                o: ["الحياة السياسية كجسد من التفاعلات تتلقى المدخلات وتصدر المخرجات (القرارات والسياسات)", "مجموعة القوانين المكتوبة في الجريدة الرسمية وحدها", "تنظيم إداري تقليدي غير متفاعل مع بيئته", "هيكل قضائي للفصل في النزاعات الدستورية"],
                c: 0
            },
            {
                q: "كيف عرف ابن خلدون علم السياسة والدولة في مقدمته الشهيرة؟",
                o: ["بربط العمران البشري بالسياسة ومبدأ العلية الطبيعية وأهمية الأخلاق في قوة وبقاء الدول", "باعتبارها تنظيماً رأسمالياً بحتاً", "من خلال الاعتماد على الدساتير الوضعية الغربية", "بنفي وجود أي صلة بين العدل وخراب العمران"],
                c: 0
            },
            {
                q: "ما هي الوظائف الأساسية للنظام السياسي حسب تحليل جابرييل ألموند؟",
                o: ["مقدار الضبط، المقدرة الاستخراجية، التوزيعية، والجوابية، إضافة لوظائف التحويل والتنشئة", "سن القوانين الزجرية فقط", "جمع الضرائب وتمويل المشاريع الكبرى", "إدارة السجون والمؤسسات العقابية"],
                c: 0
            },
            {
                q: "ما هو الفرق الجوهري بين علم السياسة والفلسفة السياسية؟",
                o: ["علم السياسة دراسة وصفية تحليلية لما هو كائن، بينما الفلسفة دراسة معيارية لما ينبغي أن تكون عليه الدولة", "لا يوجد أي فرق بينهما", "الفلسفة تعتمد على التجربة المختبرية والعلمية بدقة", "علم السياسة يهتم بالأخلاق البحتة فقط"],
                c: 0
            },
            {
                q: "ما هي الأركان الأساسية الثلاثة لقيام الدولة من منظور علم السياسة؟",
                o: ["الشعب، الإقليم، والسلطة الحاكمة", "اللغة، الدين، والتاريخ المشترك", "الأحزاب، البرلمان، والحكومة", "الجيش، الشرطة، والمحاكم"],
                c: 0
            },
            {
                q: "إلى ماذا ترجع أصول كلمة 'سياسة' في اللغة الإنجليزية (Politics)؟",
                o: ["إلى لفظ Polis اليوناني الذي يعني المدينة-الدولة", "إلى مصطلح لاتيني يعني الإدارة المالية", "إلى كلمة عربية بمعنى الرئاسة", "إلى مفهوم فرنسي حديث يعني البرلمان"],
                c: 0
            },
            {
                q: "ماذا يقصد بالقطيعة الابستيمولوجية عند الفيلسوف غاستون باشلار؟",
                o: ["تخليص المعرفة العلمية من الأحكام المسبقة والتأملات الميتافيزيقية والاقتراب من العقلانية التطبيقية", "قطع العلاقات الدبلوماسية بين الدول", "إلغاء التدريس الجامعي للعلوم الإنسانية", "الفصل التام بين القانون والدستور"],
                c: 0
            },
            {
                q: "كيف ينظر كارل ماركس إلى الدولة والسلطة السياسية؟",
                o: ["بأنها أداة أو قوة منظمة لطبقة معينة لقمع طبقة أخرى (البرجوازية للطبقة الكادحة)", "بأنها وسيلة لتحقيق الرفاه المطلق لجميع الأفراد بالتساوي", "بأنها ظاهرة محايدة لا علاقة لها بالاقتصاد", "بأنها مؤسسة دينية مقدسة"],
                c: 0
            },
            {
                q: "ما هي النظرية التي دافع عنها مونتسكيو في كتابه 'روح القوانين'؟",
                o: ["نظرية فصل السلطات (التشريعية، التنفيذية، والقضائية) لضمان الحرية", "نظرية الحكم المطلق الفردي", "نظرية سيادة الطبقة العاملة", "نظرية العقد الاجتماعي المطلق"],
                c: 0
            },
            {
                q: "ما هو دور الأحزاب السياسية داخل النسق السياسي حسب أدبيات علم السياسة؟",
                o: ["تأطير المواطنين والمنافسة على الوصول إلى السلطة وتجميع المطالب والمصالح", "جباية الضرائب العامة للدولة", "إصدار الأحكام القضائية النهائية", "إدارة الإدارات المركزية للوزارات"],
                c: 0
            },
            {
                q: "ما المقصود بجماعات الضغط (لوبيات) في الحقل السياسي؟",
                o: ["تنظيمات تسعى للتأثير على قرار السلطة من خارج المؤسسات الرسمية دون السعي المباشر لتولي الحكم", "أحزاب سياسية حاكمة فازت بالانتخابات", "مؤسسات أمنية رسمية لمراقبة الحدود", "مجالس قضائية عليا"],
                c: 0
            },
            {
                q: "من هو صاحب كتاب 'الديمقراطية في أمريكا' واعتبر سوسيولوجي الحرية والمقارنة؟",
                o: ["ألكسيس دي توكفيل", "أوغست كونت", "جون لوك", "توماس هوبز"],
                c: 0
            },
            {
                q: "ما هي المراحل الثلاث لتطور الفكر البشري حسب الفيلسوف أوغست كونت؟",
                o: ["المرحلة اللاهوتية، المرحلة الميتافيزيقية، والمرحلة الوضعية", "المرحلة البدائية، الإقطاعية، والرأسمالية", "مرحلة القوة، مرحلة العقد، ومرحلة الدستور", "مرحلة الأسرة، القبيلة، والدولة"],
                c: 0
            },
            {
                q: "ما هي أهمية التاريخ بالنسبة لعلم السياسة حسب المقولة الشهيرة؟",
                o: ["علم السياسة بلا تاريخ كنبات بلا جذور، والتاريخ بدون علم السياسة كنبات بلا ثمر", "التاريخ علم مستقل تماماً ولا علاقة له بالسياسة", "السياسة تلغي التاريخ وتصنعه من الصفر", "التاريخ مجرد سرد لقصص قديمة لا تنفع الباحث"],
                c: 0
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            const item = questions[currentIdx];
            document.getElementById('q-number').innerText = `السؤال ${currentIdx + 1} من ${questions.length}`;
            document.getElementById('progress-text').innerText = `التقدم: ${Math.round(((currentIdx + 1) / questions.length) * 100)}%`;
            document.getElementById('q-text').innerText = item.q;
            
            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = '';

            item.o.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-right p-4 rounded-xl border border-slate-700 bg-slate-700/50 hover:bg-slate-700 transition font-medium text-slate-200';
                btn.innerText = opt;
                btn.onclick = () => selectOption(idx, btn);
                optionsBox.appendChild(btn);
            });

            document.getElementById('next-btn').classList.add('hidden');
        }

        function selectOption(selectedIdx, btnElement) {
            if (answered) return;
            answered = true;

            const item = questions[currentIdx];
            const buttons = document.getElementById('options-box').children;

            if (selectedIdx === item.c) {
                btnElement.classList.remove('bg-slate-700/50', 'border-slate-700');
                btnElement.classList.add('bg-teal-900/60', 'border-teal-500', 'text-teal-200');
                score++;
                document.getElementById('score-display').innerText = `النتيجة الصحيحة: ${score}`;
            } else {
                btnElement.classList.remove('bg-slate-700/50', 'border-slate-700');
                btnElement.classList.add('bg-rose-900/60', 'border-rose-500', 'text-rose-200');
                buttons[item.c].classList.remove('bg-slate-700/50', 'border-slate-700');
                buttons[item.c].classList.add('bg-teal-900/60', 'border-teal-500', 'text-teal-200');
            }

            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < questions.length) {
                loadQuestion();
            } else {
                document.getElementById('quiz-container').classList.add('hidden');
                document.getElementById('result-box').classList.remove('hidden');
                document.getElementById('final-score').innerText = `أتممت الاختبار بنجاح! نتيجتك النهائية هي: ${score} من ${questions.length}`;
            }
        }

        function restartQuiz() {
            currentIdx = 0;
            score = 0;
            document.getElementById('score-display').innerText = `النتيجة الصحيحة: 0`;
            document.getElementById('result-box').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
